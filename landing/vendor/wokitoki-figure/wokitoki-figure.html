k-num">02</span><span class="wk-part-name">Tapa</span><span class="wk-part-say">Por aquí sale la voz de la familia, se ve la luz y entra la voz del niño.</span></button><button type="button" class="wk-part" data-part="lid"><span class="wk-num">03</span><span class="wk-part-name">Bajo la tapa</span><span class="wk-part-say">Un parlante pequeño, un anillo de luces de colores y el micrófono, diseñado para grabar solo mientras el botón rojo está apretado.</span></button><button type="button" class="wk-part" data-part="brain"><span class="wk-num">04</span><span class="wk-part-name">Cerebro</span><span class="wk-part-say">Un pequeño computador con WiFi que envía su voz y recibe las de la familia.</span></button><button type="button" class="wk-part" data-part="base"><span class="wk-num">05</span><span class="wk-part-name">Base</span><span class="wk-part-say">La bandeja de abajo, con la entrada del cable USB y patas de caucho para que no se resbale.</span></button><button type="button" class="wk-part" data-part="screws"><span class="wk-num">06</span><span class="wk-part-name">Tornillos</span><span class="wk-part-say">Tornillos por debajo, para que manitos curiosas no la abran.</span></button></span></div></figure></div>
