# Keeps the free Supabase project awake: Supabase pauses free projects after
# a week without database activity. This runs a real query every 3 days.
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity; re-enable it from the Actions tab if that happens.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the keepalive table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/keepalive?select=id" \
            -H "apikey: $SUPABASE_KEY"
